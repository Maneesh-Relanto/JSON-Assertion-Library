name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build release artifacts
      run: mvn -B clean package -DskipTests
      
    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ steps.version.outputs.VERSION }}
        body: |
          ## JSONAssertX ${{ steps.version.outputs.VERSION }}
          
          ### Features
          - Enhanced JSON assertions with visual diff
          - Fluent API for readable test code
          - Deep JSON comparison
          - Schema validation support
          - Snapshot testing capabilities
          - Spring integration
          - JUnit 5 integration
          
          ### Installation
          ```xml
          <dependency>
              <groupId>io.jsonassertx</groupId>
              <artifactId>jsonassertx-core</artifactId>
              <version>${{ steps.version.outputs.VERSION }}</version>
              <scope>test</scope>
          </dependency>
          ```
          
          ### Documentation
          - [User Guide](https://github.com/yourusername/jsonassertx#readme)
          - [API Documentation](https://javadoc.io/doc/io.jsonassertx/jsonassertx-core)
          - [Visual Diff Showcase](https://yourusername.github.io/jsonassertx/visual-diff-showcase.html)
          
          ### What's Changed
          See [CHANGELOG.md](CHANGELOG.md) for full details.
        draft: false
        prerelease: false
        
    - name: Upload JAR artifacts
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./jsonassertx-core/target/jsonassertx-core-${{ steps.version.outputs.VERSION }}.jar
        asset_name: jsonassertx-core-${{ steps.version.outputs.VERSION }}.jar
        asset_content_type: application/java-archive

  publish-maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: release
    if: github.repository_owner == 'yourusername'  # Replace with your GitHub username
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: ossrh
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE
        
    - name: Publish to Maven Central
      run: mvn -B clean deploy -P release
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  publish-javadoc:
    name: Publish Javadoc to GitHub Pages
    runs-on: ubuntu-latest
    needs: release
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Generate Javadoc
      run: mvn -B javadoc:aggregate
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/site/apidocs
        destination_dir: javadoc
